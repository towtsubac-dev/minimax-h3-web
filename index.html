<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniMax H3 I2V</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #preview {
      max-width: 100%;
      max-height: 500px;
      display: none;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }

    #result {
      display: none;
      width: 100%;
      margin-top: 20px;
    }

    video {
      width: 100%;
      max-width: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <h1>MiniMax H3 I2V</h1>

  <div class="section">
    <label for="imageInput">画像</label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Preview"
    >
  </div>

  <div class="section">
    <label for="prompt">プロンプト</label>

    <textarea
      id="prompt"
      placeholder="動画生成のプロンプトを入力してください"
    ></textarea>
  </div>

  <div class="section">
    <button id="generateButton">
      動画生成
    </button>
  </div>

  <div id="status"></div>

  <video
    id="result"
    controls
    playsinline
  ></video>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const promptInput = document.getElementById("prompt");
    const generateButton = document.getElementById("generateButton");
    const statusElement = document.getElementById("status");
    const resultVideo = document.getElementById("result");

    let imageBase64 = "";
    let naturalWidth = 0;
    let naturalHeight = 0;

    // ---------------------------------------------------------
    // Image selection
    // ---------------------------------------------------------

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (!file) {
        imageBase64 = "";
        naturalWidth = 0;
        naturalHeight = 0;

        preview.style.display = "none";
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        imageBase64 = reader.result;

        preview.src = imageBase64;
        preview.style.display = "block";

        const image = new Image();

        image.onload = () => {
          naturalWidth = image.naturalWidth;
          naturalHeight = image.naturalHeight;

          console.log(
            "Original image:",
            naturalWidth,
            "x",
            naturalHeight
          );
        };

        image.src = imageBase64;
      };

      reader.readAsDataURL(file);
    });

    // ---------------------------------------------------------
    // Calculate H3 resolution
    // ---------------------------------------------------------

    function calculateH3Resolution() {
      const MAX_WIDTH = 768;
      const MAX_HEIGHT = 736;
      const STEP = 32;

      if (
        !naturalWidth ||
        !naturalHeight
      ) {
        return {
          width: 768,
          height: 736
        };
      }

      const aspectRatio =
        naturalWidth / naturalHeight;

      let targetWidth;
      let targetHeight;

      // Start by fitting the image to the maximum height.
      targetHeight = MAX_HEIGHT;
      targetWidth = targetHeight * aspectRatio;

      // If width exceeds the maximum,
      // fit to the maximum width instead.
      if (targetWidth > MAX_WIDTH) {
        targetWidth = MAX_WIDTH;
        targetHeight = targetWidth / aspectRatio;
      }

      // H3 requires dimensions in 32-pixel increments.
      let width =
        Math.round(targetWidth / STEP) * STEP;

      let height =
        Math.round(targetHeight / STEP) * STEP;

      // Safety limits.
      width = Math.max(
        STEP,
        Math.min(MAX_WIDTH, width)
      );

      height = Math.max(
        STEP,
        Math.min(MAX_HEIGHT, height)
      );

      console.log(
        "Original image:",
        naturalWidth,
        "x",
        naturalHeight
      );

      console.log(
        "Original aspect ratio:",
        aspectRatio
      );

      console.log(
        "H3 resolution:",
        width,
        "x",
        height
      );

      return {
        width,
        height
      };
    }

    // ---------------------------------------------------------
    // Generate
    // ---------------------------------------------------------

    generateButton.addEventListener("click", async () => {

      if (!imageBase64) {
        alert("画像を選択してください。");
        return;
      }

      if (
        !naturalWidth ||
        !naturalHeight
      ) {
        alert("画像サイズを取得できませんでした。");
        return;
      }

      generateButton.disabled = true;

      resultVideo.style.display = "none";
      resultVideo.removeAttribute("src");
      resultVideo.load();

      statusElement.textContent =
        "生成リクエストを送信しています…";

      try {

        // Calculate resolution from original image aspect ratio.
        const resolution =
          calculateH3Resolution();

        console.log(
          "Sending resolution:",
          resolution.width,
          "x",
          resolution.height
        );

        // -----------------------------------------------------
        // Send generation request
        // -----------------------------------------------------

        const response = await fetch(
          "/api/generate",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              image: imageBase64,
              prompt: promptInput.value,

              width: resolution.width,
              height: resolution.height
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "生成リクエストに失敗しました。"
          );
        }

        if (!data.job_id) {
          throw new Error(
            "RunPodのjob IDを取得できませんでした。"
          );
        }

        const jobId = data.job_id;

        console.log(
          "RunPod job ID:",
          jobId
        );

        statusElement.textContent =
          "生成を開始しました。\n" +
          "Job ID: " +
          jobId +
          "\n\n" +
          "生成中…";

        // -----------------------------------------------------
        // Poll status
        // -----------------------------------------------------

        const maxAttempts = 180;
        let attempts = 0;

        while (attempts < maxAttempts) {

          attempts++;

          await new Promise(
            resolve => setTimeout(resolve, 5000)
          );

          const statusResponse =
            await fetch(
              "/api/status?job_id=" +
              encodeURIComponent(jobId)
            );

          const statusData =
            await statusResponse.json();

          console.log(
            "Status:",
            statusData
          );

          if (!statusResponse.ok) {
            throw new Error(
              statusData.error ||
              "ステータス取得に失敗しました。"
            );
          }

          // ---------------------------------------------------
          // COMPLETED
          // ---------------------------------------------------

          if (
            statusData.status ===
            "COMPLETED"
          ) {

            statusElement.textContent =
              "生成完了。";

            const outputs =
              statusData.output &&
              statusData.output.outputs;

            if (
              !outputs ||
              !outputs.length
            ) {
              throw new Error(
                "生成結果の動画が見つかりません。"
              );
            }

            const videoOutput =
              outputs.find(
                item =>
                  item.type === "video" ||
                  item.data ||
                  item.base64
              );

            if (!videoOutput) {
              throw new Error(
                "動画出力を取得できませんでした。"
              );
            }

            const videoBase64 =
              videoOutput.data ||
              videoOutput.base64;

            if (!videoBase64) {
              throw new Error(
                "動画のBase64データがありません。"
              );
            }

            resultVideo.src =
              "data:video/mp4;base64," +
              videoBase64;

            resultVideo.style.display =
              "block";

            resultVideo.load();

            break;
          }

          // ---------------------------------------------------
          // FAILED
          // ---------------------------------------------------

          if (
            statusData.status ===
            "FAILED"
          ) {

            const errorMessage =
              statusData.error ||
              statusData.output?.error ||
              "RunPodで動画生成に失敗しました。";

            throw new Error(
              errorMessage
            );
          }

          // ---------------------------------------------------
          // IN_QUEUE / IN_PROGRESS
          // ---------------------------------------------------

          statusElement.textContent =
            "生成中…\n" +
            "状態: " +
            (statusData.status || "UNKNOWN") +
            "\n" +
            "経過: 約" +
            (attempts * 5) +
            "秒";
        }

        if (attempts >= maxAttempts) {
          throw new Error(
            "生成が15分以内に完了しませんでした。"
          );
        }

      } catch (error) {

        console.error(
          "Generation error:",
          error
        );

        statusElement.textContent =
          "エラー:\n" +
          (error.message ||
            "不明なエラーが発生しました。");

      } finally {

        generateButton.disabled = false;
      }
    });
  </script>

</body>
</html>
