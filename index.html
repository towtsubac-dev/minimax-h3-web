<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax H3 Video</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      font: inherit;
    }

    .preview {
      margin-top: 15px;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      white-space: pre-wrap;
    }

    #result {
      margin-top: 20px;
    }

    video {
      width: 100%;
      border-radius: 12px;
    }
  </style></head><body><div class="container">  <h1>MiniMax H3 Video</h1>  <div class="card"><label for="image">画像</label>
<input id="image" type="file" accept="image/*">

<div id="preview" class="preview"></div>

<label for="prompt">プロンプト</label>

<textarea id="prompt">A realistic subject remains in the same position and composition. Subtle natural movement and blinking. Keep the appearance and body shape consistent throughout the video. Keep the camera completely stable with no zoom or reframing.</textarea>

<button id="generate">動画生成</button>

<div id="status"></div>

<div id="result"></div>

  </div></div><script>
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
const generateButton = document.getElementById("generate");
const status = document.getElementById("status");
const result = document.getElementById("result");

let selectedImage = null;
let imageWidth = 0;
let imageHeight = 0;

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];

  if (!file) {
    selectedImage = null;
    imageWidth = 0;
    imageHeight = 0;
    preview.innerHTML = "";
    return;
  }

  selectedImage = file;

  const url = URL.createObjectURL(file);

  const img = new Image();

  img.onload = () => {
    imageWidth = img.naturalWidth;
    imageHeight = img.naturalHeight;

    preview.innerHTML = `
      <img src="${url}" alt="選択した画像">
      <div style="margin-top:8px;font-size:14px;color:#666;">
        ${imageWidth} × ${imageHeight}
      </div>
    `;
  };

  img.src = url;
});

generateButton.addEventListener("click", async () => {

  if (!selectedImage) {
    status.textContent = "画像を選択してください。";
    return;
  }

  if (!imageWidth || !imageHeight) {
    status.textContent = "画像サイズを取得できませんでした。";
    return;
  }

  const prompt = document.getElementById("prompt").value;

  // 元画像の縦横比を維持して生成サイズを決定
  const maxWidth = 768;
  const maxHeight = 736;
  const multiple = 16;

  const scale = Math.min(
    maxWidth / imageWidth,
    maxHeight / imageHeight
  );

  let width = Math.round(imageWidth * scale);
  let height = Math.round(imageHeight * scale);

  // H3で扱いやすいよう16の倍数にする
  width = Math.max(
    multiple,
    Math.round(width / multiple) * multiple
  );

  height = Math.max(
    multiple,
    Math.round(height / multiple) * multiple
  );

  // 最大サイズを超えないよう再調整
  if (width > maxWidth) {
    width = maxWidth;
    height = Math.round((width * imageHeight / imageWidth) / multiple) * multiple;
  }

  if (height > maxHeight) {
    height = maxHeight;
    width = Math.round((height * imageWidth / imageHeight) / multiple) * multiple;
  }

  console.log("Original image:", imageWidth, "x", imageHeight);
  console.log("Generation size:", width, "x", height);

  generateButton.disabled = true;
  status.textContent =
    "画像を準備しています…\n" +
    `生成サイズ: ${width} × ${height}`;

  result.innerHTML = "";

  try {

    // 画像をBase64に変換
    const imageBase64 = await fileToBase64(selectedImage);

    status.textContent =
      "RunPodに生成ジョブを送信しています…\n" +
      `生成サイズ: ${width} × ${height}`;

    // 生成ジョブを開始
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: imageBase64,
        prompt: prompt,
        width: width,
        height: height
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "生成ジョブの開始に失敗しました。");
    }

    if (!data.job_id) {
      throw new Error("RunPodのジョブIDが取得できませんでした。");
    }

    const jobId = data.job_id;

    status.textContent =
      "動画を生成しています…\n" +
      `生成サイズ: ${width} × ${height}\n` +
      "ジョブID: " + jobId;

    // RunPodの状態を確認
    await pollJob(jobId);

  } catch (error) {

    console.error(error);
    status.textContent = "エラー:\n" + error.message;

    generateButton.disabled = false;
  }
});

async function pollJob(jobId) {

  const maxAttempts = 180;
  const interval = 5000;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {

    await sleep(interval);

    const response = await fetch(
      "/api/status?job_id=" + encodeURIComponent(jobId),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "RunPodの状態確認に失敗しました。"
      );
    }

    console.log("RunPod status:", data);

    if (data.status === "IN_QUEUE") {

      status.textContent =
        "生成待機中…\n" +
        "ジョブID: " + jobId;

      continue;
    }

    if (data.status === "IN_PROGRESS") {

      status.textContent =
        "動画を生成しています…\n" +
        "ジョブID: " + jobId;

      continue;
    }

    if (data.status === "COMPLETED") {

      const outputs = data.output?.outputs || [];

      const video = outputs.find(
        output =>
          output.type === "video" ||
          output.filename?.toLowerCase().endsWith(".mp4")
      );

      if (!video?.data) {
        throw new Error(
          "生成は完了しましたが、動画データが見つかりません。"
        );
      }

      status.textContent = "生成完了";

      result.innerHTML = `
        <video controls autoplay playsinline>
          <source src="data:video/mp4;base64,${video.data}" type="video/mp4">
        </video>
      `;

      generateButton.disabled = false;

      return;
    }

    if (data.status === "FAILED") {
      throw new Error(
        "RunPodで動画生成に失敗しました。\n" +
        JSON.stringify(data.error || data.output || data)
      );
    }

    status.textContent =
      "処理中… (" + data.status + ")\n" +
      "ジョブID: " + jobId;
  }

  throw new Error(
    "生成が長時間完了しませんでした。ジョブID: " + jobId
  );
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {
      const result = reader.result;

      // data:image/jpeg;base64,... の
      // "data:image/jpeg;base64," 部分を除去
      const base64 = result.split(",")[1];

      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}
</script></body>
</html>
