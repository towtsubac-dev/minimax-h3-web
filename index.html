<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniMax H3 Image to Video</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="file"],
    textarea {
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      padding: 10px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #preview {
      max-width: 100%;
      max-height: 500px;
      display: none;
      margin-top: 10px;
    }

    #video {
      width: 100%;
      max-height: 700px;
      display: none;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info {
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 14px;
    }

    .error {
      color: #c00;
    }

    .success {
      color: #080;
    }
  </style>
</head>

<body>

  <h1>MiniMax H3 Image to Video</h1>

  <div class="section">
    <label for="imageInput">画像</label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Preview"
    >

    <div
      id="resolutionInfo"
      class="info"
      style="display:none;"
    ></div>
  </div>

  <div class="section">
    <label for="prompt">プロンプト</label>

    <textarea
      id="prompt"
      placeholder="動画にしたい動きを入力してください"
    ></textarea>
  </div>

  <div class="section">
    <button
      id="generateButton"
      disabled
    >
      動画生成
    </button>
  </div>

  <div id="status"></div>

  <video
    id="video"
    controls
  ></video>


  <script>

    // ---------------------------------------------------------
    // Elements
    // ---------------------------------------------------------

    const imageInput =
      document.getElementById("imageInput");

    const preview =
      document.getElementById("preview");

    const promptInput =
      document.getElementById("prompt");

    const generateButton =
      document.getElementById("generateButton");

    const statusElement =
      document.getElementById("status");

    const videoElement =
      document.getElementById("video");

    const resolutionInfo =
      document.getElementById("resolutionInfo");


    // ---------------------------------------------------------
    // Image state
    // ---------------------------------------------------------

    let imageBase64 = "";

    let naturalWidth = 0;
    let naturalHeight = 0;


    // ---------------------------------------------------------
    // Status helper
    // ---------------------------------------------------------

    function setStatus(message, type = "") {

      statusElement.textContent = message;

      statusElement.className = type;
    }


    // ---------------------------------------------------------
    // H3 resolution calculation
    //
    // Official MiniMax H3 canvas logic:
    // - short edge = 768
    // - maximum area = 768 x 1344
    // - each axis rounded to a multiple of 32
    //
    // Example:
    // 2928 x 3660 (4:5)
    // -> 768 x 960
    // ---------------------------------------------------------

    function calculateH3Resolution() {

      const BASE_SHORT_EDGE = 768;

      const MAX_PIXELS =
        768 * 1344;

      const STEP = 32;


      if (
        !naturalWidth ||
        !naturalHeight
      ) {

        return {
          width: 768,
          height: 768
        };
      }


      const aspectRatio =
        naturalWidth / naturalHeight;


      let width;
      let height;


      // -------------------------------------------------------
      // Preserve original aspect ratio
      // -------------------------------------------------------

      if (aspectRatio >= 1.0) {

        // Landscape

        height = BASE_SHORT_EDGE;

        width =
          height * aspectRatio;

      } else {

        // Portrait

        width = BASE_SHORT_EDGE;

        height =
          width / aspectRatio;
      }


      // -------------------------------------------------------
      // Maximum H3 canvas area
      // -------------------------------------------------------

      if (
        width * height >
        MAX_PIXELS
      ) {

        const scale =
          Math.sqrt(
            MAX_PIXELS /
            (width * height)
          );

        width *= scale;
        height *= scale;
      }


      // -------------------------------------------------------
      // Round each axis to 32 pixels
      // -------------------------------------------------------

      width =
        Math.max(
          STEP,
          Math.round(width / STEP) * STEP
        );

      height =
        Math.max(
          STEP,
          Math.round(height / STEP) * STEP
        );


      // -------------------------------------------------------
      // Safety check
      // -------------------------------------------------------

      while (
        width * height >
        MAX_PIXELS
      ) {

        if (width >= height) {

          width -= STEP;

        } else {

          height -= STEP;
        }
      }


      console.log(
        "Original image:",
        naturalWidth,
        "x",
        naturalHeight
      );

      console.log(
        "Original aspect ratio:",
        aspectRatio
      );

      console.log(
        "H3 resolution:",
        width,
        "x",
        height
      );

      console.log(
        "H3 aspect ratio:",
        width / height
      );


      return {
        width,
        height
      };
    }


    // ---------------------------------------------------------
    // Display resolution information
    // ---------------------------------------------------------

    function updateResolutionInfo() {

      if (
        !naturalWidth ||
        !naturalHeight
      ) {

        resolutionInfo.style.display =
          "none";

        return;
      }


      const resolution =
        calculateH3Resolution();


      const originalRatio =
        naturalWidth /
        naturalHeight;


      const outputRatio =
        resolution.width /
        resolution.height;


      resolutionInfo.textContent =
        `元画像: ${naturalWidth} × ${naturalHeight}` +
        `\n元画像比率: ${originalRatio.toFixed(4)}` +
        `\nH3生成解像度: ${resolution.width} × ${resolution.height}` +
        `\n生成比率: ${outputRatio.toFixed(4)}`;


      resolutionInfo.style.display =
        "block";
    }


    // ---------------------------------------------------------
    // Read selected image
    // ---------------------------------------------------------

    imageInput.addEventListener(
      "change",
      () => {

        const file =
          imageInput.files?.[0];


        if (!file) {

          imageBase64 = "";

          naturalWidth = 0;
          naturalHeight = 0;

          preview.style.display =
            "none";

          resolutionInfo.style.display =
            "none";

          generateButton.disabled =
            true;

          return;
        }


        const reader =
          new FileReader();


        reader.onload = () => {

          imageBase64 =
            reader.result;


          const image =
            new Image();


          image.onload = () => {

            naturalWidth =
              image.naturalWidth;

            naturalHeight =
              image.naturalHeight;


            preview.src =
              imageBase64;

            preview.style.display =
              "block";


            updateResolutionInfo();


            generateButton.disabled =
              false;
          };


          image.onerror = () => {

            setStatus(
              "画像の読み込みに失敗しました。",
              "error"
            );

            generateButton.disabled =
              true;
          };


          image.src =
            imageBase64;
        };


        reader.onerror = () => {

          setStatus(
            "画像ファイルの読み込みに失敗しました。",
            "error"
          );

          generateButton.disabled =
            true;
        };


        reader.readAsDataURL(file);
      }
    );


    // ---------------------------------------------------------
    // Generate
    // ---------------------------------------------------------

    generateButton.addEventListener(
      "click",
      async () => {

        if (!imageBase64) {

          setStatus(
            "画像を選択してください。",
            "error"
          );

          return;
        }


        const resolution =
          calculateH3Resolution();


        generateButton.disabled =
          true;


        videoElement.style.display =
          "none";

        videoElement.removeAttribute(
          "src"
        );


        setStatus(
          `動画生成を開始しています。\n` +
          `生成解像度: ${resolution.width} × ${resolution.height}`
        );


        try {

          // ---------------------------------------------------
          // Submit RunPod job
          // ---------------------------------------------------

          const response =
            await fetch(
              "/api/generate",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  image:
                    imageBase64,

                  prompt:
                    promptInput.value || "",

                  width:
                    resolution.width,

                  height:
                    resolution.height
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "動画生成ジョブの登録に失敗しました。"
            );
          }


          if (!data.job_id) {

            throw new Error(
              "RunPodのjob IDを取得できませんでした。"
            );
          }


          const jobId =
            data.job_id;


          setStatus(
            `動画生成中です。\n` +
            `解像度: ${resolution.width} × ${resolution.height}\n` +
            `Job ID: ${jobId}`
          );


          // ---------------------------------------------------
          // Poll status
          // ---------------------------------------------------

          const MAX_ATTEMPTS = 180;

          let completed = false;


          for (
            let attempt = 0;
            attempt < MAX_ATTEMPTS;
            attempt++
          ) {

            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  5000
                )
            );


            const statusResponse =
              await fetch(
                `/api/status?job_id=${encodeURIComponent(jobId)}`
              );


            const statusData =
              await statusResponse.json();


            if (!statusResponse.ok) {

              throw new Error(
                statusData.error ||
                "ステータス取得に失敗しました。"
              );
            }


            console.log(
              "RunPod status:",
              statusData
            );


            // -------------------------------------------------
            // Completed
            // -------------------------------------------------

            if (
              statusData.status ===
              "COMPLETED"
            ) {

              completed = true;


              const outputs =
                statusData.output?.outputs;


              if (
                !outputs ||
                !outputs.length
              ) {

                throw new Error(
                  "生成完了しましたが、動画データが見つかりません。"
                );
              }


              const output =
                outputs[0];


              let videoBase64 =
                output.video ||
                output.data ||
                output;


              if (
                typeof videoBase64 !==
                "string"
              ) {

                throw new Error(
                  "動画データの形式を認識できません。"
                );
              }


              // ---------------------------------------------
              // Remove data URL prefix if present
              // ---------------------------------------------

              if (
                videoBase64.startsWith(
                  "data:"
                )
              ) {

                videoElement.src =
                  videoBase64;

              } else {

                videoElement.src =
                  `data:video/mp4;base64,${videoBase64}`;
              }


              videoElement.style.display =
                "block";


              setStatus(
                `動画生成が完了しました。\n` +
                `解像度: ${resolution.width} × ${resolution.height}`,
                "success"
              );


              break;
            }


            // -------------------------------------------------
            // Failed
            // -------------------------------------------------

            if (
              statusData.status ===
                "FAILED" ||
              statusData.status ===
                "CANCELLED"
            ) {

              throw new Error(
                statusData.error ||
                statusData.output?.error ||
                `RunPodジョブが${statusData.status}になりました。`
              );
            }


            // -------------------------------------------------
            // Still running
            // -------------------------------------------------

            setStatus(
              `動画生成中です。\n` +
              `解像度: ${resolution.width} × ${resolution.height}\n` +
              `状態: ${statusData.status}\n` +
              `経過確認: ${attempt + 1} / ${MAX_ATTEMPTS}`
            );
          }


          if (!completed) {

            throw new Error(
              "動画生成が15分以内に完了しませんでした。"
            );
          }


        } catch (error) {

          console.error(
            "Generation error:",
            error
          );


          setStatus(
            `エラー:\n${error.message}`,
            "error"
          );


        } finally {

          generateButton.disabled =
            false;
        }
      }
    );

  </script>

</body>
</html>
