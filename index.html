<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax H3 動画生成</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    h1 { font-size: 24px; }
    .section { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="file"], textarea, select { width: 100%; box-sizing: border-box; font-size: 16px; }
    select { padding: 10px; }
    .mode-tabs { display: flex; gap: 8px; }
    .mode-tab { flex: 1; width: auto; padding: 12px 10px; border: 1px solid #888; border-radius: 8px; background: #f3f3f3; color: #222; font-weight: 600; }
    .mode-tab[aria-selected="true"] { background: #222; border-color: #222; color: #fff; }
    .mode-tab:disabled { cursor: not-allowed; opacity: .65; }
    textarea { min-height: 120px; padding: 10px; resize: vertical; }
    button { width: 100%; padding: 14px 24px; font-size: 16px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #preview { max-width: 100%; max-height: 500px; display: none; margin-top: 10px; }
    #video { width: 100%; max-height: 700px; display: none; margin-top: 20px; }
    .download-link { display: none; box-sizing: border-box; margin-top: 12px; padding: 14px 24px; border-radius: 6px; background: #222; color: #fff; text-align: center; text-decoration: none; font-size: 16px; font-weight: 600; }
    #promptHistoryDropdown { margin-top: 10px; }
    #promptHistoryDropdown summary { cursor: pointer; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-weight: 600; list-style-position: inside; }
    #promptHistoryDropdown[open] summary { margin-bottom: 8px; }
    .prompt-history-item { display: flex; align-items: stretch; gap: 8px; margin: 8px 0; }
    .prompt-history-use { flex: 1; min-width: 0; width: auto; text-align: left; padding: 10px; overflow: hidden; overflow-wrap: anywhere; }
    .prompt-history-delete { width: auto; flex: 0 0 auto; padding: 10px 12px; }
    #historyList { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .history-item { min-width: 0; }
    .history-item:focus-visible { outline: 3px solid #444; outline-offset: 3px; }
    .history-thumbnail { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #000; cursor: pointer; display: block; }
    .history-tile-label { font-size: 12px; color: #555; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #historyModal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    #historyModal[aria-hidden="false"] { display: flex; }
    .history-modal-content { width: min(100%, 520px); max-height: 94dvh; overflow: auto; background: #171717; color: #fff; border-radius: 12px; padding: 12px; box-sizing: border-box; }
    .history-modal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    #historyModalClose { width: auto; padding: 6px 12px; background: transparent; border: 0; color: white; font-size: 28px; }
    #historyModalVideo { display: block; width: 100%; max-height: 65dvh; background: #000; border-radius: 8px; }
    #historyModalMeta { font-size: 13px; white-space: pre-wrap; margin: 8px 0; overflow-wrap: anywhere; }
    .history-modal-actions { display: flex; gap: 8px; }
    .history-modal-actions button { flex: 1; min-width: 0; padding: 10px 4px; font-size: 14px; }
    .history-content { min-width: 0; }
    .history-prompt { display: block; overflow-wrap: anywhere; }
    .history-meta { font-size: 14px; color: #555; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; }
    .history-actions { display: flex; gap: 8px; margin-top: 10px; }
    .history-actions button { flex: 1; padding: 10px 8px; }
    .history-empty { color: #666; font-size: 14px; }
    #status { margin-top: 15px; white-space: pre-wrap; word-break: break-word; }
    .info { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .lora-option { border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin: 10px 0; }
    .lora-check { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .lora-check input[type="checkbox"] { width: 18px; height: 18px; flex: 0 0 auto; }
    .lora-strength label { margin-bottom: 4px; font-weight: normal; }
    input[type="range"] { width: 100%; box-sizing: border-box; }
    .error { color: #c00; }
    .success { color: #080; }
    @media (max-width: 600px) {
      #historyList { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    }
  </style>
</head>
<body>
  <h1>MiniMax H3 動画生成</h1>

  <div class="section"><label for="modelSelect">生成モデル</label><select id="modelSelect"><option value="h3">MiniMax H3</option><option value="erosmax">Eros Max H3</option></select></div>

  <div class="section">
    <label>生成モード</label>
    <div class="mode-tabs" role="tablist" aria-label="生成モード">
      <button type="button" class="mode-tab" id="imageModeTab" role="tab" aria-selected="true" aria-controls="imageSection">画像 → 動画</button>
      <button type="button" class="mode-tab" id="textModeTab" role="tab" aria-selected="false" aria-controls="prompt">テキスト → 動画</button>
      <button type="button" class="mode-tab" id="extendModeTab" role="tab" aria-selected="false" aria-controls="extendSection">動画延長</button>
    </div>
  </div>

  <div class="section" id="durationSection">
    <label for="durationSelect">動画の長さ</label>
    <select id="durationSelect">
      <option value="3">3秒</option>
      <option value="5" selected>5秒</option>
      <option value="8">8秒</option>
      <option value="10">10秒</option>
    </select>
  </div>

  <div class="section" id="erosLoraSection" style="display:none">
<label>Eros Max ライブラリLoRA（最大2つ・未選択でなし）</label>
<div id="erosLibraryLoras"></div>
<p id="erosLibraryStatus" style="font-size:0.85em"></p>
<a href="/lora-library.html" target="_blank" rel="noopener noreferrer">LoRA管理画面</a>
</div>

  <div class="section" id="h3LibrarySection">
    <label>MiniMax H3 ライブラリLoRA</label>
    <div id="h3LibraryLoras"></div>
    <p id="h3LibraryStatus" style="font-size:0.85em"></p>
    <a href="/lora-library.html" target="_blank" rel="noopener noreferrer">LoRA管理画面</a>
  </div>

  <div class="section" id="imageSection">
    <label for="imageInput">画像</label>
    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" alt="選択した画像のプレビュー">
    <div id="resolutionInfo" class="info" style="display:none;"></div>
  </div>

  <div class="section" id="promptSection">
    <label for="prompt">プロンプト</label>
    <textarea id="prompt" placeholder="動画にしたい動きや場面を入力してください"></textarea>
    <div class="section" id="promptHistorySection">
      <details id="promptHistoryDropdown">
        <summary>History</summary>
        <div id="promptHistoryList"></div>
      </details>
    </div>
  </div>

  <div class="section" id="generateSection"><button id="generateButton" disabled>動画を生成</button></div>
  <div id="status" role="status" aria-live="polite"></div>

  <video id="video" controls playsinline></video>
  <a id="downloadVideoButton" class="download-link" href="#" download="minimax-h3-video.mp4">動画を保存</a>

  <section class="section" id="extendSection" style="display:none;">
    <h2>動画を延長</h2>
    <label for="extendLocalFile">端末からMP4動画を選択</label>
    <input id="extendLocalFile" type="file" accept=".mp4,video/mp4">
    <p class="info">または、下の生成履歴にある「延長」ボタンから動画を選択できます。</p>
    <p id="extendSourceName">動画を選択してください。</p>
    <video id="extendPreview" controls playsinline preload="metadata" style="display:none;width:100%;max-height:320px;margin-bottom:12px;"></video>
    <label for="extendPrompt">延長部分のプロンプト</label>
    <textarea id="extendPrompt" placeholder="元動画の場面や動きを自然に続けてください"></textarea>
    <label for="extendSeconds">延長する長さ</label>
    <select id="extendSeconds"><option value="3">3秒</option><option value="5">5秒</option><option value="8">8秒</option><option value="10">10秒</option></select>
    <label for="extendPassword">動画延長パスワード</label>
    <input id="extendPassword" type="password" autocomplete="off" placeholder="Vercelに設定したパスワード" style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;margin-bottom:12px;">
    <p class="info" id="extendHelp">20MiB以下のMP4動画（端末または生成履歴）に対応しています。動画は非公開のR2へ一時アップロードされます。</p>
    <button type="button" id="r2DiagnoseButton" style="margin-bottom:10px;">R2接続を診断</button>
    <div id="r2DiagnosticResult" class="info" style="display:none;"></div>
    <button type="button" id="extendSubmit">この動画を延長</button>
    <button type="button" id="extendCancel">キャンセル</button>
  </section>

  <section class="section" id="historySection">
    <h2>生成履歴</h2>
    <p class="history-empty">このブラウザに保存された動画がここに表示されます。履歴はこの端末・ブラウザ内だけに保存されます。</p>
    <div id="historyList" aria-live="polite"></div>
  </section>
  <div id="historyModal" role="dialog" aria-modal="true" aria-label="生成動画の詳細" aria-hidden="true">
    <div class="history-modal-content">
      <div class="history-modal-top"><span id="historyModalCount"></span><button type="button" id="historyModalClose" aria-label="閉じる">×</button></div>
      <video id="historyModalVideo" controls playsinline preload="metadata"></video>
      <div id="historyModalMeta"></div>
      <div class="history-modal-actions"><button type="button" id="historyModalSave">保存</button><button type="button" id="historyModalExtend">延長</button><button type="button" id="historyModalDelete">削除</button></div>
    </div>
  </div>

<script>
const imageModeTab = document.getElementById("imageModeTab");
const textModeTab = document.getElementById("textModeTab");
const extendModeTab = document.getElementById("extendModeTab");
let currentMode = "image";
function setMode(mode) { if(extendBusy)return; currentMode = mode; imageModeTab.setAttribute("aria-selected", String(mode === "image")); textModeTab.setAttribute("aria-selected", String(mode === "text")); extendModeTab.setAttribute("aria-selected", String(mode === "extend")); updateModeUI(); setStatus(""); }
imageModeTab.addEventListener("click", () => setMode("image"));
textModeTab.addEventListener("click", () => setMode("text"));
extendModeTab.addEventListener("click", () => setMode("extend"));

const durationSelect = document.getElementById("durationSelect");
const modelSelect = document.getElementById("modelSelect");
const erosLoraControls = [];
const h3LibraryControls = [];
function getSelectedH3LibraryLoras(){return h3LibraryControls.filter(c=>c.checkbox.checked).map(c=>({name:c.name,strength:Number(c.strength.value)}));}
function getSelectedErosLoras(){return erosLoraControls.filter(c=>c.checkbox.checked).map(c=>({name:c.name,strength:Number(c.strength.value)}));}
async function loadErosLibraryLoras(){
  const container=document.getElementById("erosLibraryLoras");
  const status=document.getElementById("erosLibraryStatus");
  const h3Container=document.getElementById("h3LibraryLoras");
  const h3Status=document.getElementById("h3LibraryStatus");
  status.textContent="登録LoRAを確認中...";
  try{
    const response=await fetch("/api/lora?action=options",{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    container.replaceChildren();
    h3Container.replaceChildren();
    erosLoraControls.length=0;
    h3LibraryControls.length=0;
    for(const entry of data.loras||[]){
      const compatible=entry.compatible_models||["erosmax"];
      for(const target of ["erosmax","h3"]){
      if(!compatible.includes(target))continue;
      const targetContainer=target==="h3"?h3Container:container;
      const targetControls=target==="h3"?h3LibraryControls:erosLoraControls;
      if(!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(entry.id))continue;
      const wrapper=document.createElement("div");
      wrapper.className="lora-option";
      const label=document.createElement("label");
      label.className="lora-check";
      const check=document.createElement("input");
      check.type="checkbox";
      label.append(check,document.createTextNode(" "+entry.name));
      const strengthWrap=document.createElement("div");
      strengthWrap.className="lora-strength";
      const strengthLabel=document.createElement("label");
      const value=document.createElement("span");
      value.textContent="1.00";
      strengthLabel.append(document.createTextNode("強度："),value);
      const slider=document.createElement("input");
      slider.type="range";slider.min="0";slider.max=target==="h3"?"1.5":"2";slider.step="0.05";slider.value="1";
      slider.addEventListener("input",()=>{value.textContent=Number(slider.value).toFixed(2);});
      strengthWrap.append(strengthLabel,slider);
      wrapper.append(label,strengthWrap);
      targetContainer.append(wrapper);
      targetControls.push({name:"library:"+entry.id,checkbox:check,strength:slider,value});
      }
    }
    status.textContent=erosLoraControls.length?"対応LoRAを表示しました。":"Eros Max対応LoRAはありません。";
    h3Status.textContent=h3LibraryControls.length?"対応LoRAを表示しました。":"H3対応LoRAはありません。";
  }catch(error){status.textContent="登録LoRAの取得に失敗しました。";h3Status.textContent="登録LoRAの取得に失敗しました。";}
}
loadErosLibraryLoras();
for(const c of erosLoraControls)c.strength.addEventListener("input",()=>{c.value.textContent=Number(c.strength.value).toFixed(2);});
let h3Duration = durationSelect.value;
modelSelect.addEventListener("change",()=>{
  const eros=modelSelect.value==="erosmax";
  document.getElementById("erosLoraSection").style.display=eros?"":"none";
  document.getElementById("h3LibrarySection").style.display=eros?"none":"";
  for(const option of durationSelect.options) option.disabled=eros&&option.value!=="5";
  if(eros){h3Duration=durationSelect.value;durationSelect.value="5";}
  else durationSelect.value=h3Duration;
  extendModeTab.disabled=false;
  updateModeUI();updateGenerateButton();
});

const imageSection = document.getElementById("imageSection");
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const promptInput = document.getElementById("prompt");
const promptHistoryList = document.getElementById("promptHistoryList");
const promptHistoryDropdown = document.getElementById("promptHistoryDropdown");
const PROMPT_HISTORY_KEY = "minimax-h3-prompt-history";
const PROMPT_HISTORY_LIMIT = 5;
const PROMPT_HISTORY_DISPLAY_LIMIT = 300;
function readPromptHistory() {
  try { const saved = JSON.parse(localStorage.getItem(PROMPT_HISTORY_KEY) || "[]"); return Array.isArray(saved) ? saved.filter(item => typeof item === "string" && item.trim()).slice(0, PROMPT_HISTORY_LIMIT) : []; }
  catch (error) { console.warn("Prompt history could not be read:", error); return []; }
}
function savePromptHistory(prompt) {
  const normalizedPrompt = prompt.trim(); if (!normalizedPrompt) return;
  const history = readPromptHistory().filter(item => item !== normalizedPrompt); history.unshift(normalizedPrompt);
  try { localStorage.setItem(PROMPT_HISTORY_KEY, JSON.stringify(history.slice(0, PROMPT_HISTORY_LIMIT))); renderPromptHistory(); }
  catch (error) { console.warn("Prompt history could not be saved:", error); setStatus("プロンプト履歴を保存できませんでした。ブラウザの保存領域を確認してください。", "error"); }
}
function truncatePromptForDisplay(prompt) { return prompt.length > PROMPT_HISTORY_DISPLAY_LIMIT ? prompt.slice(0, PROMPT_HISTORY_DISPLAY_LIMIT) + "…" : prompt; }
function renderPromptHistory() {
  promptHistoryList.replaceChildren();
  const history = readPromptHistory();
  if (!history.length) { const empty = document.createElement("p"); empty.className="history-empty"; empty.textContent="まだ履歴はありません。"; promptHistoryList.appendChild(empty); return; }
  history.forEach((savedPrompt, index) => {
    const row = document.createElement("div"); row.className="prompt-history-item";
    const useButton = document.createElement("button"); useButton.type="button"; useButton.className="prompt-history-use"; useButton.textContent=truncatePromptForDisplay(savedPrompt); useButton.title="このプロンプトを入力欄に戻す";
    useButton.addEventListener("click", () => { promptInput.value=savedPrompt; updateGenerateButton(); promptInput.focus(); promptInput.scrollIntoView({behavior:"smooth",block:"center"}); });
    const deleteButton = document.createElement("button"); deleteButton.type="button"; deleteButton.className="prompt-history-delete"; deleteButton.textContent="削除"; deleteButton.setAttribute("aria-label", `プロンプト履歴 ${index+1} 件目を削除`);
    deleteButton.addEventListener("click", () => { const nextHistory=readPromptHistory().filter((_,itemIndex)=>itemIndex!==index); try { localStorage.setItem(PROMPT_HISTORY_KEY,JSON.stringify(nextHistory)); renderPromptHistory(); } catch(error) { console.warn("Prompt history could not be updated:",error); } });
    row.append(useButton,deleteButton); promptHistoryList.appendChild(row);
  });
}

const generateButton = document.getElementById("generateButton");
const statusElement = document.getElementById("status");
const videoElement = document.getElementById("video");
const downloadVideoButton = document.getElementById("downloadVideoButton");
const resolutionInfo = document.getElementById("resolutionInfo");
const historyList = document.getElementById("historyList");
const extendSection=document.getElementById("extendSection");
const extendSourceName=document.getElementById("extendSourceName");
const extendLocalFile=document.getElementById("extendLocalFile");
const extendPreview=document.getElementById("extendPreview");
let extendPreviewUrl=null;
const extendPrompt=document.getElementById("extendPrompt");
const extendSeconds=document.getElementById("extendSeconds");
const extendPassword=document.getElementById("extendPassword");
const extendSubmit=document.getElementById("extendSubmit");
const extendCancel=document.getElementById("extendCancel");
let extendSourceId=null,extendBusy=false;
const HISTORY_DB_NAME="minimax-h3-video-history";
const HISTORY_STORE_NAME="videos";
let currentVideoObjectUrl=null;
const historyObjectUrls=new Set();
function openHistoryDB() { return new Promise((resolve,reject)=>{ const request=indexedDB.open(HISTORY_DB_NAME,1); request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(HISTORY_STORE_NAME))db.createObjectStore(HISTORY_STORE_NAME,{keyPath:"id"});}; request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error||new Error("履歴データベースを開けませんでした。")); }); }
async function saveHistoryItem(item) { const db=await openHistoryDB(); try { await new Promise((resolve,reject)=>{const tx=db.transaction(HISTORY_STORE_NAME,"readwrite");tx.objectStore(HISTORY_STORE_NAME).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("履歴を保存できませんでした。"));tx.onabort=()=>reject(tx.error||new Error("履歴の保存が中断されました。"));});} finally {db.close();} }
async function getHistoryItems() { const db=await openHistoryDB(); try {return await new Promise((resolve,reject)=>{const tx=db.transaction(HISTORY_STORE_NAME,"readonly");const request=tx.objectStore(HISTORY_STORE_NAME).getAll();request.onsuccess=()=>resolve(request.result.sort((a,b)=>b.createdAt-a.createdAt));request.onerror=()=>reject(request.error||new Error("履歴を読み込めませんでした。"));});} finally {db.close();} }
async function getHistoryItem(id) { const db=await openHistoryDB(); try {return await new Promise((resolve,reject)=>{const request=db.transaction(HISTORY_STORE_NAME,"readonly").objectStore(HISTORY_STORE_NAME).get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error("動画を読み込めませんでした。"));});} finally {db.close();} }
async function deleteHistoryItem(id) { const db=await openHistoryDB(); try {await new Promise((resolve,reject)=>{const tx=db.transaction(HISTORY_STORE_NAME,"readwrite");tx.objectStore(HISTORY_STORE_NAME).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("履歴を削除できませんでした。"));tx.onabort=()=>reject(tx.error||new Error("履歴の削除が中断されました。"));});} finally {db.close();} }
function formatHistoryDate(timestamp){return new Date(timestamp).toLocaleString("ja-JP");}
async function playHistoryItem(id) {
  const saved=await getHistoryItem(id); if(!saved) throw new Error("履歴の動画が見つかりません。");
  if(currentVideoObjectUrl)URL.revokeObjectURL(currentVideoObjectUrl); currentVideoObjectUrl=URL.createObjectURL(saved.blob); videoElement.src=currentVideoObjectUrl; videoElement.style.display="block"; downloadVideoButton.href=currentVideoObjectUrl; downloadVideoButton.download=saved.filename; downloadVideoButton.style.display="block"; videoElement.scrollIntoView({behavior:"smooth",block:"start"}); setStatus("履歴から動画を読み込みました。","success");
}
const historyModal=document.getElementById("historyModal");
const historyModalVideo=document.getElementById("historyModalVideo");
let modalVideoUrl=null,modalHistoryId=null,modalPreviousFocus=null;
function closeHistoryModal(){
  historyModalVideo.pause();historyModalVideo.removeAttribute("src");historyModalVideo.load();
  if(modalVideoUrl){URL.revokeObjectURL(modalVideoUrl);modalVideoUrl=null;}
  historyModal.setAttribute("aria-hidden","true");document.body.style.overflow="";
  modalHistoryId=null;
  if(modalPreviousFocus?.isConnected)modalPreviousFocus.focus();
}
async function openHistoryModal(id,index,total){
  const saved=await getHistoryItem(id);if(!saved)throw new Error("履歴の動画が見つかりません。");
  if(modalVideoUrl)URL.revokeObjectURL(modalVideoUrl);
  modalHistoryId=id;modalPreviousFocus=document.activeElement;modalVideoUrl=URL.createObjectURL(saved.blob);
  historyModalVideo.src=modalVideoUrl;
  document.getElementById("historyModalCount").textContent=(index+1)+" / "+total;
  document.getElementById("historyModalMeta").textContent=formatHistoryDate(saved.createdAt)+"\n"+(saved.mode==="extend"?"延長動画":saved.mode==="image"?"画像 → 動画":"テキスト → 動画")+"・"+saved.duration+"秒・"+saved.width+" × "+saved.height+"\n"+(saved.prompt||"");
  historyModal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
  document.getElementById("historyModalClose").focus();
}
document.getElementById("historyModalClose").addEventListener("click",closeHistoryModal);
historyModal.addEventListener("click",event=>{if(event.target===historyModal)closeHistoryModal();});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&historyModal.getAttribute("aria-hidden")==="false")closeHistoryModal();});
document.getElementById("historyModalSave").addEventListener("click",async()=>{
  try{const saved=await getHistoryItem(modalHistoryId);if(!saved)throw new Error("動画が見つかりません。");
    const url=URL.createObjectURL(saved.blob);const link=document.createElement("a");link.href=url;link.download=saved.filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(error){setStatus("動画の保存に失敗しました："+error.message,"error");}
});
document.getElementById("historyModalExtend").addEventListener("click",async()=>{
  try{const saved=await getHistoryItem(modalHistoryId);if(!saved)throw new Error("動画が見つかりません。");
    closeHistoryModal();extendSourceId=saved.id;extendLocalFile.value="";setExtendPreview(saved.blob);extendSourceName.textContent="履歴動画: "+saved.filename;extendPrompt.value=saved.prompt||"Continue the video naturally, maintaining the same scene, subject, and camera movement.";setMode("extend");extendSection.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(error){setStatus("延長する動画を選択できませんでした："+error.message,"error");}
});
document.getElementById("historyModalDelete").addEventListener("click",async()=>{
  if(!modalHistoryId||!confirm("この動画を履歴から削除しますか？"))return;
  try{await deleteHistoryItem(modalHistoryId);closeHistoryModal();await renderHistory();setStatus("履歴から動画を削除しました。","success");}
  catch(error){setStatus("履歴の削除に失敗しました："+error.message,"error");}
});
async function renderHistory() {

// ErosMax: extract the last decodable video frame locally; never upload the source MP4.
async function extractLastFrame(blob){
  const url=URL.createObjectURL(blob), player=document.createElement("video");
  player.preload="auto";player.muted=true;player.playsInline=true;
  try{
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error("動画の読み込みがタイムアウトしました。")),30000);
      player.onloadedmetadata=()=>{clearTimeout(timer);resolve();};
      player.onerror=()=>{clearTimeout(timer);reject(new Error("このMP4をブラウザで再生できません。"));};
      player.src=url;player.load();
    });
    if(!Number.isFinite(player.duration)||player.duration<=0||!player.videoWidth||!player.videoHeight)throw new Error("動画の長さまたは解像度を取得できません。");
    const target=Math.max(0,player.duration-Math.min(0.08,player.duration/2));
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error("最終フレームの取得がタイムアウトしました。")),30000);
      player.onseeked=()=>{clearTimeout(timer);resolve();};
      player.onerror=()=>{clearTimeout(timer);reject(new Error("最終フレームに移動できません。"));};
      player.currentTime=target;
    });
    const canvas=document.createElement("canvas");canvas.width=player.videoWidth;canvas.height=player.videoHeight;
    const context=canvas.getContext("2d");if(!context)throw new Error("Canvasを使用できません。");
    context.drawImage(player,0,0,canvas.width,canvas.height);
    return {image:canvas.toDataURL("image/jpeg",0.92),width:canvas.width,height:canvas.height};
  }finally{player.removeAttribute("src");player.load();URL.revokeObjectURL(url);}
}

    let saved;
    if(sourceId){saved=await getHistoryItem(sourceId);if(!saved||!(saved.blob instanceof Blob))throw new Error("元動画が履歴に見つかりません。");}
    else {const file=extendLocalFile.files?.[0];if(!file)throw new Error("延長するMP4動画を選択してください。");if(!/\.mp4$/i.test(file.name)||file.type&&file.type!=="video/mp4")throw new Error("MP4ファイルを選択してください。");saved={blob:file,filename:file.name,mode:"local",duration:0,width:0,height:0};}
    if(saved.blob.size<=0||saved.blob.size>20*1024*1024)throw new Error("動画は20MiB以下のMP4を選択してください。");
    if(modelSelect.value==="erosmax" && saved.blob.size<=2800000){await extendErosContextDirect(saved,prompt,seconds);return;}
    const password=extendPassword.value;
    if(!password)throw new Error("動画延長パスワードを入力してください。");
    setStatus("R2へのアップロードを準備しています...");
    const signingResponse=await fetch("/api/upload-url",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password,size:saved.blob.size})});
    const signingData=await signingResponse.json();
    if(!signingResponse.ok)throw new Error(signingData.error||"アップロードURLを取得できませんでした。");
    setStatus("動画をCloudflare Worker経由でアップロードしています...");
    let uploadResponse;try{uploadResponse=await fetch(signingData.upload_url,{method:"PUT",headers:{"Content-Type":"video/mp4"},body:saved.blob});}catch(uploadError){throw new Error("Cloudflare Workerへのアップロード通信に失敗しました（ブラウザ: "+uploadError.message+"）。");}
    if(!uploadResponse.ok)throw new Error("Cloudflare Workerへの動画アップロードに失敗しました。HTTP "+uploadResponse.status);
    setStatus("動画延長を開始しています...");
    const response=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:modelSelect.value,mode:"extend",prompt,extend_seconds:seconds,video_key:signingData.key,upload_password:password,loras:modelSelect.value==="erosmax"?[]:getSelectedH3LibraryLoras()})});
    const data=await response.json();
    if(!response.ok||!data.job_id)throw new Error(data.error||"延長ジョブを開始できませんでした。");
    const jobId=data.job_id;
    let completed=false;
    for(let attempt=0;attempt<180;attempt++){
      await new Promise(resolve=>setTimeout(resolve,5000));
      const result=await fetch("/api/status?job_id="+encodeURIComponent(jobId)+"&model="+(modelSelect.value==="erosmax"?"erosmax_extend":"h3"));
      const statusData=await result.json();
      if(!result.ok)throw new Error(statusData.error||"状態を確認できませんでした。");
      if(statusData.status==="COMPLETED"){
        const output=statusData.output?.outputs?.[0];
        const encoded=output?.data||output?.video;
        if(typeof encoded!=="string"||!encoded)throw new Error("延長動画データがありません。");
        const dataUrl=encoded.startsWith("data:")?encoded:"data:video/mp4;base64,"+encoded;
        const videoResponse=await fetch(dataUrl);
        const videoBlob=await videoResponse.blob();
        const createdAt=Date.now();
        const filename="minimax-h3-extended-"+seconds+"s-"+new Date(createdAt).toISOString().replace(/[:.]/g,"-")+".mp4";
        let warning="";
        try{await saveHistoryItem({id:createdAt+"-"+Math.random().toString(36).slice(2),createdAt,filename,blob:videoBlob,mode:"extend",duration:(saved.duration||0)+seconds,prompt,width:saved.width,height:saved.height});await renderHistory();}
        catch(error){console.error("Extend history save failed:",error);warning=" 履歴への保存には失敗しました。";}
        if(currentVideoObjectUrl)URL.revokeObjectURL(currentVideoObjectUrl);
        currentVideoObjectUrl=URL.createObjectURL(videoBlob);
        videoElement.src=currentVideoObjectUrl;videoElement.style.display="block";
        downloadVideoButton.href=currentVideoObjectUrl;downloadVideoButton.download=filename;downloadVideoButton.style.display="block";
        setStatus("動画の延長が完了しました。"+warning+formatJobTiming(statusData),"success");
        videoElement.scrollIntoView({behavior:"smooth",block:"start"});
        completed=true;break;
      }
      if(["FAILED","CANCELLED"].includes(statusData.status))throw new Error(statusData.error||statusData.output?.error||"延長ジョブが失敗しました。");
      setStatus("動画延長中...\nJob ID: "+jobId+"\n状態: "+statusData.status);
    }
    if(!completed)throw new Error("動画延長が15分以内に完了しませんでした。");
  }catch(error){console.error("Extension error:",error);setStatus("延長エラー: "+error.message,"error");}
  finally{extendBusy=false;extendSubmit.disabled=false;extendCancel.disabled=false;extendLocalFile.disabled=false;imageModeTab.disabled=false;textModeTab.disabled=false;extendModeTab.disabled=false;updateGenerateButton();}
});

updateModeUI();updateGenerateButton();renderHistory();renderPromptHistory();
</script>
